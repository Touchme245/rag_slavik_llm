spring:
  application:
    name: llm
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma3:4b
        options:
          timeout: 120s
          keep-alive: 10m
  datasource:
    url: jdbc:postgresql://localhost:5430/ragdb
    username: user
    password: password
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG