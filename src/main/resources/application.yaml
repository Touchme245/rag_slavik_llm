spring:
  application:
    name: llm
  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        model: qwen3:8b
        options:
          timeout: 120s
          keep-alive: 10m
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5430/ragdb}
    username: user
    password: password
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG