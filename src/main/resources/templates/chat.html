<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title th:text="${chat != null} ? 'Slavik GPT — ' + chat.title : 'Slavik GPT'">
        Slavik GPT
    </title>

    <link rel="stylesheet"
          type="text/css"
          th:href="@{/css/chat.css}"/>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script defer
            th:src="@{/js/chat.js}"></script>

</head>

<body class="chat-body">

<div class="chat-layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="brand">

                <h1>Slavik GPT</h1>

                <p>
                    AI workspace
                </p>

            </div>

            <form th:action="@{/logout}"
                  method="post">

                <button type="submit"
                        class="logout-btn">

                    Logout

                </button>

            </form>

        </div>

        <div class="sidebar-content">

            <ul class="chat-list">

                <li th:each="c : ${chats}"
                    th:classappend="${chat != null and chat.id != null and c.id == chat.id} ? 'active' : ''">

                    <a th:href="@{/chat/{id}(id=${c.id})}"
                       class="chat-link">

                        <span th:text="${c.title}">
                            Chat
                        </span>

                    </a>

                    <form th:action="@{/chat/{id}/delete(id=${c.id})}"
                          method="post"
                          onsubmit="return confirm('Delete chat?');">

                        <button type="submit"
                                class="delete-chat-btn">

                            ×

                        </button>

                    </form>

                </li>

            </ul>

        </div>

        <div class="sidebar-footer">

            <form action="/chat/new"
                  method="post"
                  class="new-chat-form">

                <input type="text"
                       name="title"
                       placeholder="New chat"
                       required/>

                <button type="submit"
                        class="new-chat-btn">

                    Create Chat

                </button>

            </form>

        </div>

    </aside>

    <!-- Main -->

    <main class="chat-main">

        <div class="messages"
             id="messages">

            <th:block th:if="${chat != null}">

                <div th:if="${!#lists.isEmpty(chat.history)}"
                     th:each="entry : ${chat.history}"
                     th:class="${entry.role.role eq 'user'} ? 'message user' : 'message assistant'">

                    <div class="avatar">

                        <img th:src="${entry.role.role eq 'user'} ? '/images/user.png' : '/images/mentor.png'"
                             alt="avatar">

                    </div>

                    <div class="bubble"
                         th:text="${entry.content}">

                    </div>

                </div>

            </th:block>

        </div>

        <div th:if="${chat != null}"
             class="input-wrapper">

            <form th:action="@{/chat/{chatId}/entry(chatId=${chat.id})}"
                  method="post"
                  class="input-form">

                <textarea id="chat-input"
                          name="prompt"
                          placeholder="Ask anything..."
                          required></textarea>

                <button type="button"
                        id="send-button">

                    Send

                </button>

            </form>

        </div>

    </main>

</div>

</body>

</html>
