<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <title>Slavik GPT — Register</title>

    <link rel="stylesheet"
          type="text/css"
          th:href="@{/css/auth.css}">
</head>

<body class="auth-body">

<div class="auth-layout">

    <div class="auth-card">

        <div class="brand-block">

            <h1>Slavik GPT</h1>

            <p>
                Create your private AI workspace
            </p>

        </div>

        <div th:if="${error}"
             class="message error"
             th:text="${error}">
        </div>

        <form th:action="@{/register}"
              method="post"
              class="auth-form">

            <div class="input-group">

                <label>
                    Username
                </label>

                <input type="text"
                       name="username"
                       required>

            </div>

            <div class="input-group">

                <label>
                    Password
                </label>

                <input type="password"
                       name="password"
                       required>

            </div>

            <button type="submit"
                    class="auth-button">

                Create Account

            </button>

        </form>

        <a th:href="@{/login}"
           class="auth-link">

            Already have an account

        </a>

    </div>

</div>

</body>
</html>
